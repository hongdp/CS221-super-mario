[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mario-rl"
version = "2.0.0"
description = "Reinforcement learning agents that generalize across Super Mario Bros. levels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Hong" }, { name = "Yaqi Zhang" }]
dependencies = [
  "gymnasium>=1.1",
  "numpy>=1.26",
  "stable-retro>=1.0",
  "torch>=2.4",
  "pillow>=10",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.16"]
video = ["imageio[ffmpeg]>=2.34"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
mario-rl = "mario_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mario_rl"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that spawn worker processes"]
